<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pump It Up trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="level-controller.css?v=136">
</head>
<body>

  <div class="vignette"></div>

  <div id="app">

    <header class="app-header">
      <button class="header-btn is-hidden" id="restartBtn" title="Finish session" aria-label="Finish session">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 6 L8 12 L14 18"/>
        </svg>
      </button>
      <div class="app-header-title">Pump It Up <span>trainer</span></div>
      <button class="header-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">&#9974;</button>
    </header>

    <!-- SETUP SCREEN -->
    <section class="setup" id="setup" hidden>
      <div class="setup-main">
        <div class="field">
          <label for="startLevelInput">Warm-up at level</label>
          <div class="level-input-row">
            <button type="button" class="io-btn level-step-btn" id="startLevelDownBtn" title="Decrease level" aria-label="Decrease level">&#8722;</button>
            <input type="number" id="startLevelInput" placeholder="e.g. 14" min="1" inputmode="numeric">
            <button type="button" class="io-btn level-step-btn" id="startLevelUpBtn" title="Increase level" aria-label="Increase level">&#43;</button>
          </div>
        </div>
        <button id="startBtn">Go</button>
        <p class="error" id="setupError" hidden>Enter a valid level number.</p>
      </div>
      <div class="io-row">
        <button type="button" class="io-btn" id="importBtn">Import JSON</button>
        <button type="button" class="io-btn" id="viewDataBtn">View / Edit Data</button>
      </div>
    </section>

    <!-- PLAY SCREEN -->
    <section class="play" id="play" hidden>
      <button class="level-nav-btn level-nav-left" id="levelDownBtn" title="Decrease level" aria-label="Decrease level">&#8722;</button>
      <button class="level-nav-btn level-nav-right" id="levelUpBtn" title="Increase level" aria-label="Increase level">&#43;</button>

      <div class="session-wrap">
        <div class="eyebrow">Session Progress</div>
        <div class="session-scroll" id="sessionScroll"></div>
      </div>

      <div class="v-gap"></div>

      <div class="level-block">
        <div class="eyebrow">Next chart</div>
        <div class="mode-row">
          <div class="mode-group">
            <button type="button" class="mode-btn" id="modeSinglesBtn">Singles</button>
            <button type="button" class="mode-btn" id="modeDoublesBtn">Doubles</button>
          </div>
          <button type="button" class="mode-btn" id="modeRandomBtn">Random</button>
        </div>
        <div class="number-wrap">
          <div class="burst pink" id="levelBurst"></div>
          <div class="level-ball-mask" id="levelNumber" aria-live="polite">
            <div class="level-ball">
              <span class="level-ball-type">Single</span>
              <span class="level-ball-value">--</span>
            </div>
          </div>
        </div>
      </div>

      <div class="rec-av">
        <span class="rec-av-prefix">AV</span><span class="rec-av-value" id="recAv">&mdash;</span>
      </div>

      <div class="v-gap"></div>

      <div class="target-block">
        <div class="eyebrow">Try to get score</div>
        <div class="target-row">
          <button class="btn btn-fail" id="failBtn"><span class="btn-symbol">&lt;</span><span class="btn-footer">fail</span></button>
          <div class="number-wrap">
            <div class="burst cyan" id="targetBurst"></div>
            <div class="target-number" id="targetNumber" aria-live="polite">--</div>
          </div>
          <button class="btn btn-pass" id="passBtn"><span class="btn-symbol">&ge;</span><span class="btn-footer">pass</span></button>
        </div>
      </div>
    </section>

    <!-- NO DATA SCREEN -->
    <section class="no-data" id="noData" hidden>
      <div class="eyebrow">Level</div>
      <div class="level-number no-data-level" id="noDataLevel">--</div>
      <p>No table entry for this level yet. Jump to a different level below, or add it via View / Edit Data on the setup screen.</p>
      <div class="jump-row">
        <input type="number" id="jumpInput" inputmode="numeric">
        <button id="jumpBtn">Jump</button>
      </div>
    </section>

    <!-- DATA IMPORT / VIEW-EDIT MODAL -->
    <div class="modal-overlay" id="dataModal" hidden>
      <div class="modal">
        <h2 id="dataModalTitle">Import Level Data</h2>
        <textarea class="data-textarea" id="dataTextarea" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <p class="error" id="dataModalError" hidden></p>
        <div class="modal-actions">
          <button type="button" class="modal-btn ghost" id="copyDataBtn">Copy</button>
          <button type="button" class="modal-btn ghost" id="cancelDataBtn">Cancel</button>
          <button type="button" class="modal-btn primary" id="saveDataBtn">Save</button>
        </div>
      </div>
    </div>

  </div>

  <script src="model.js?v=9"></script>
  <script src="ui/tools.js?v=7"></script>
  <script src="ui/session_tries_history.js?v=13"></script>
  <script src="ui/session_screen.js?v=29"></script>
  <script src="ui/start_screen.js?v=10"></script>
  <script src="ui/data_modal.js?v=3"></script>
  <script src="app.js?v=33"></script>

</body>
</html>
