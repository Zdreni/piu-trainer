<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pump It Up trainer</title>
<link rel="stylesheet" href="level-controller.css?v=8">
</head>
<body>

  <div class="lanes"></div>
  <div class="vignette"></div>

  <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">&#9974;</button>

  <div id="app">

    <!-- SETUP SCREEN -->
    <section class="setup" id="setup">
      <h1>Pump It Up <span>trainer</span></h1>
      <div class="field">
        <label for="startLevelInput">Start at level</label>
        <input type="number" id="startLevelInput" placeholder="e.g. 14" min="1" inputmode="numeric">
      </div>
      <button id="startBtn">Go</button>
      <p class="error" id="setupError" hidden>Enter a valid level number.</p>
      <div class="io-row">
        <button type="button" class="io-btn" id="importBtn">Import JSON</button>
        <button type="button" class="io-btn" id="viewDataBtn">View / Edit Data</button>
      </div>
    </section>

    <!-- PLAY SCREEN -->
    <section class="play" id="play" hidden>
      <button class="restart-btn" id="restartBtn" title="Change level" aria-label="Change level">&#8634;</button>

      <div class="level-block">
        <div class="eyebrow">Level</div>
        <div class="number-wrap">
          <div class="burst pink" id="levelBurst"></div>
          <div class="level-number" id="levelNumber" aria-live="polite">--</div>
        </div>
      </div>

      <div class="mods-row">
        <div class="mod-card">
          <span class="mod-label">AV &middot; Singles</span>
          <span class="mod-value" id="avSingles">&mdash;</span>
        </div>
        <div class="mod-card">
          <span class="mod-label">AV &middot; Doubles</span>
          <span class="mod-value" id="avDoubles">&mdash;</span>
        </div>
      </div>

      <div class="attempts-spacer"></div>

      <div class="ladder-wrap">
        <div class="eyebrow">Level Chart Attempts <span class="tag" id="attemptTag">1/1</span></div>
        <div class="ladder" id="ladder"></div>
      </div>

      <div class="target-block">
        <div class="eyebrow">Chart Target Score</div>
        <div class="number-wrap">
          <div class="burst cyan" id="targetBurst"></div>
          <div class="target-number" id="targetNumber" aria-live="polite">--</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-fail" id="failBtn">Score Missed</button>
        <button class="btn btn-pass" id="passBtn">Score Achieved</button>
      </div>
    </section>

    <!-- NO DATA SCREEN -->
    <section class="no-data" id="noData" hidden>
      <button class="restart-btn" id="restartBtnNoData" title="Change level" aria-label="Change level">&#8634;</button>
      <div class="eyebrow">Level</div>
      <div class="level-number no-data-level" id="noDataLevel">--</div>
      <p>No table entry for this level yet. Jump to a different level below, or add it via View / Edit Data on the setup screen.</p>
      <div class="jump-row">
        <input type="number" id="jumpInput" inputmode="numeric">
        <button id="jumpBtn">Jump</button>
      </div>
    </section>

    <!-- DATA IMPORT / VIEW-EDIT MODAL -->
    <div class="modal-overlay" id="dataModal" hidden>
      <div class="modal">
        <h2 id="dataModalTitle">Import Level Data</h2>
        <textarea class="data-textarea" id="dataTextarea" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <p class="error" id="dataModalError" hidden></p>
        <div class="modal-actions">
          <button type="button" class="modal-btn ghost" id="copyDataBtn">Copy</button>
          <button type="button" class="modal-btn ghost" id="cancelDataBtn">Cancel</button>
          <button type="button" class="modal-btn primary" id="saveDataBtn">Save</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js?v=6"></script>

</body>
</html>
